name: C++ CI and Documentation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-benchmark:
    name: Build, test, benchmark and generate docs
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Doxygen
        run: |
          sudo apt-get update
          sudo apt-get install --yes doxygen

      - name: Configure Release build
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=ON
          -DBACKTEST_BUILD_BENCHMARKS=ON
          -DBACKTEST_BUILD_DOCS=ON

      - name: Build
        run: cmake --build build --parallel 2

      - name: Unit and CLI tests
        run: ctest --test-dir build --output-on-failure --no-tests=error

      - name: Run example
        run: ./build/backtest_cli data/prices.csv

      - name: Benchmark (results in this log and JSON artifact)
        run: |
          ./build/benchmarks/backtest_benchmark \
            --benchmark_min_time=0.1s \
            --benchmark_repetitions=3 \
            --benchmark_out=build/benchmark.json \
            --benchmark_out_format=json

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: build/benchmark.json
          if-no-files-found: error

      - name: Generate documentation
        run: cmake --build build --target docs

      - name: Check documentation entry point
        run: test -s build/docs/html/index.html

      - name: Upload HTML documentation
        uses: actions/upload-artifact@v4
        with:
          name: doxygen-html
          path: build/docs/html
          if-no-files-found: error

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/docs/html

  deploy-docs:
    name: Publish Doxygen on GitHub Pages
    needs: build-test-benchmark
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@v4
